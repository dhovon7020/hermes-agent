name: Permanent 24/7 Hermes Bot

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '*/15 * * * *' # প্রতি ১৫ মিনিট পর পর চেক করবে বট সচল আছে কিনা, বন্ধ হলে অটো চালু করবে
  workflow_dispatch: # ম্যানুয়ালি চালু করার বাটন

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl tmux

    - name: Install Hermes Agent CLI
      run: |
        curl -fsSL https://githubusercontent.com | bash
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Hermes Default Model
      run: |
        mkdir -p $HOME/.hermes
        echo -e 'model:\n  provider: "openrouter"\n  default: "openrouter/free"' > $HOME/.hermes/config.yaml

    - name: Install Python Telegram Bot
      run: pip install python-telegram-bot flask

    - name: Run Telegram Bot In Infinite Loop
      run: |
        # গিটহাবের টাইমআউট বাইপাস করার জন্য ১০ মিনিটের লুপ মেকানিজম
        timeout 600s python bot.py || true
